# Streamlit configuration -- the single source of truth for the palette.
#
# Deloitte Cyber Engineering house style, taken from the assignment brief
# itself: white ground, black text, the Deloitte green #86BC25 as the only
# accent, thin grey rules, generous whitespace, system sans throughout.
#
# The green is an *accent*, never text. Measured at 2.4:1 against white it does
# not clear the 4.5:1 body-text floor, which is exactly how the brief uses it --
# rules, bars and small caps headers, never running prose.
#
# app/theme.py reads these values back at runtime instead of restating them in
# CSS, and tests/test_ui_render.py recomputes the WCAG contrast ratios from
# these exact strings. One copy of each colour, and a change here is caught by
# the contrast test rather than noticed later.
#
# Two prohibitions design 9.2 imposes, both visible by absence:
#   * no [[theme.fontFaces]] -- a font table pointing at a CDN would fetch from
#     the network on first paint and break NFR-02. System stacks only.
#   * theme.base is a keyword, never a URL -- base accepts a remote TOML theme,
#     which would be the same egress by another route.

[browser]
gatherUsageStats = false

[server]
headless = true

[theme]
base = "light"

backgroundColor = "#FFFFFF"                 # page
secondaryBackgroundColor = "#F7F7F7"        # panel, sidebar, table header
textColor = "#000000"                       # primary ink
codeTextColor = "#53565A"                   # secondary ink  (Deloitte grey)
grayColor = "#63666A"                       # muted ink      (Deloitte Cool Gray 10)
grayTextColor = "#63666A"
borderColor = "#D0D0CE"                     # rule / gridline
dataframeBorderColor = "#BBBCBC"            # table border
codeBackgroundColor = "#F7F7F7"
dataframeHeaderBackgroundColor = "#F7F7F7"

# The one brand colour. Used for links, focus rings and the widget accent --
# the same job it does in the brief.
primaryColor = "#86BC25"
linkColor = "#007CB0"                       # Deloitte blue, 4.6:1 on white

font = "system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
headingFont = "system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
codeFont = "ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace"

baseRadius = "2px"
linkUnderline = false
showWidgetBorder = true

# --- status palette, deliberately unthemed ---------------------------------
# The four support states are a status job, not a categorical one, so they do
# not appear under [theme.dark]: an unset section inherits from [theme], which
# is what "unthemed" means mechanically.
#
# Icon + word is mandatory on every badge regardless, so colour never carries a
# state alone (app/components/support_badge.py, and R3.2-R3.5 want words).
greenColor = "#2E7D32"                      # Corroborated    5.1:1 on white
greenTextColor = "#2E7D32"
yellowColor = "#8A6B00"                     # Single-sourced  4.7:1 on panel
yellowTextColor = "#8A6B00"
orangeColor = "#B35309"                     # Absence-based   4.7:1 on white
orangeTextColor = "#B35309"
redColor = "#C62828"                        # Conflicted      5.9:1 on white
redTextColor = "#C62828"

# --- dark mode: selected, not flipped -------------------------------------
# Its own steps against its own surface, per the method.
[theme.dark]
backgroundColor = "#111111"                 # page
secondaryBackgroundColor = "#1C1C1C"        # panel
textColor = "#FFFFFF"                       # primary ink
codeTextColor = "#C8C9C7"                   # secondary ink
grayColor = "#9A9C9B"                       # muted ink
grayTextColor = "#9A9C9B"
borderColor = "#333333"
dataframeBorderColor = "#3D3D3D"
codeBackgroundColor = "#1C1C1C"
dataframeHeaderBackgroundColor = "#111111"
primaryColor = "#86BC25"
linkColor = "#62B5E5"
